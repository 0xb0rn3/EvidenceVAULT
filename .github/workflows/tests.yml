name: File safety tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.8"
    steps:
      - name: Read the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check the Python source
        run: python -m compileall -q evidencevault Evidencevault.py tests
      - name: Check file safety and operator workflows
        run: python -m unittest discover -s tests -v

  windows-install:
    runs-on: windows-latest
    steps:
      - name: Read the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check the Windows installer with PowerShell 5.1
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_install.ps1
      - name: Check the Windows installer with PowerShell 7
        shell: pwsh
        run: ./tests/test_windows_install.ps1
      - name: Check a complete repository download
        if: github.event_name == 'push' && github.repository == 'DezTheJackal/EvidenceVAULT'
        shell: pwsh
        run: ./tests/test_windows_install.ps1 -NetworkSource
